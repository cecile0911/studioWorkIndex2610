<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChangeMe</title>
    <script src="https://unpkg.com/konva@10/konva.min.js"></script>

    <link rel="stylesheet" href="..reset.css" />

    <link rel="stylesheet" href="style.css" />

    <script src="main.js" defer></script>
  </head>
  <body>
    <main>
      <div class="toolBar"></div>
      <button id="circle-button">draw a new circle</button>
      <fieldset>
        <legend>Pick a new circle colour:</legend>

        <div>
          <input
            type="radio"
            id="change-red"
            name="colourSelect"
            value="red"
            checked
          />
          <label for="change-red">Red</label>
        </div>

        <div>
          <input
            type="radio"
            id="change-cornflower"
            name="colourSelect"
            value="cornflowerblue"
          />
          <label for="change-cornflower">Cornflower</label>
        </div>

        <div>
          <input
            type="radio"
            id="change-greenyellow"
            name="colourSelect"
            value="greenyellow"
          />
          <label for="change-greenyellow">Greenyellow</label>
        </div>
      </fieldset>

      <div class="stageContainer" id="stage-container">
        <div id="konva-stage"></div>
      </div>
    </main>
  </body>
</html>
